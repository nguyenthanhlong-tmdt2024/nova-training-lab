<section class="auth-page"><div class="auth-visual"><img src="assets/images/community-wide.webp" alt="Cộng đồng HYPE"><div class="auth-copy"><span class="eyebrow">MY HYPE</span><h1 class="page-title">CREATE YOUR ACCOUNT.</h1><p class="lead">Tài khoản hội viên cần được kích hoạt bằng email đã đăng ký với HYPE.</p></div></div><div class="auth-panel"><div class="auth-box"><span class="eyebrow">Đăng ký</span><h2 class="en-title">JOIN MY HYPE.</h2><p class="lead">Tạo tài khoản để chuẩn bị kích hoạt. Quyền lợi chỉ hiển thị sau khi HYPE đối soát hồ sơ hội viên.</p><form class="form-grid" data-register-form><div class="form-group full"><label>Họ và tên</label><input name="name" required></div><div class="form-group"><label>Email đã đăng ký với HYPE</label><input type="email" name="email" required></div><div class="form-group"><label>Số điện thoại</label><input name="phone" required></div><div class="form-group"><label>Mật khẩu</label><input type="password" name="password" required minlength="6"></div><div class="form-group"><label>Xác nhận mật khẩu</label><input type="password" name="passwordConfirm" required minlength="6"></div><label class="check-row full"><input type="checkbox" required><span>Tôi đồng ý với điều khoản tài khoản và chính sách quyền riêng tư.</span></label><div class="form-group full"><button class="btn primary block" type="submit">Tạo tài khoản</button></div></form><p class="form-note">Đã có tài khoản? <a class="text-lime" href="login.html">Đăng nhập</a>.</p></div></div></section>
